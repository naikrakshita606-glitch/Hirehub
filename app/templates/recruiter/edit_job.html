{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="card shadow-sm border-0"><div class="card-body p-4">
        <h2>Edit job</h2>
        <form method="post" class="row g-3">
            <div class="col-md-6"><label class="form-label">Title</label><input class="form-control" name="title" value="{{ job.title }}" required></div>
            <div class="col-md-6"><label class="form-label">Company</label><input class="form-control" name="company" value="{{ job.company }}" required></div>
            <div class="col-md-4"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ job.location }}"></div>
            <div class="col-md-4"><label class="form-label">Salary</label><input class="form-control" name="salary" value="{{ job.salary }}"></div>
            <div class="col-md-4"><label class="form-label">Type</label><select class="form-select" name="job_type">{% for type in ['full-time', 'part-time', 'contract'] %}<option value="{{ type }}" {% if job.job_type == type %}selected{% endif %}>{{ type|title }}</option>{% endfor %}</select></div>
            <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="5" required>{{ job.description }}</textarea></div>
            <div class="col-12"><label class="form-label">Requirements (comma separated)</label><input class="form-control" name="requirements" value="{{ job.requirements|join(', ') }}"></div>
            <div class="col-12"><button class="btn btn-primary">Save changes</button><a class="btn btn-link" href="{{ url_for('recruiter.jobs') }}">Cancel</a></div>
        </form>
    </div></div>
</div>
{% endblock %}
