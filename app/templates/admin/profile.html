{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
        <h2>Admin profile</h2>
        <form method="post" class="row g-3">
            <div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="full_name" value="{{ user.full_name }}" required></div>
            <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ user.phone }}"></div>
            <div class="col-md-6"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ user.location }}"></div>
            <div class="col-12"><button class="btn btn-primary">Save profile</button></div>
        </form>
    </div></div>
</div>
{% endblock %}
