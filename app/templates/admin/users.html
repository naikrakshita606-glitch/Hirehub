{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <h2>Users</h2>
    <table class="table table-striped">
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Update role</th></tr></thead>
        <tbody>
            {% for user in users %}
                <tr><td>{{ user.full_name }}</td><td>{{ user.email }}</td><td>{{ user.role }}</td><td>
                    <form method="post" action="{{ url_for('admin.update_user_role', user_id=user.id) }}" class="d-flex gap-2">
                        <select class="form-select form-select-sm" name="role">
                            {% for role in ['candidate', 'recruiter', 'admin'] %}<option value="{{ role }}" {% if user.role == role %}selected{% endif %}>{{ role|title }}</option>{% endfor %}
                        </select>
                        <button class="btn btn-sm btn-outline-primary">Save</button>
                    </form>
                </td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
