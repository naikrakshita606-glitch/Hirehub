{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <h2>Browse jobs</h2>
    <form class="row g-3 mb-4" method="get">
        <div class="col-md-4"><input class="form-control" type="text" name="q" value="{{ query }}" placeholder="Title, skill, or keyword"></div>
        <div class="col-md-3"><input class="form-control" type="text" name="location" value="{{ location }}" placeholder="Location"></div>
        <div class="col-md-2"><select class="form-select" name="type"><option value="">Any type</option>{% for type in ['full-time', 'part-time', 'contract'] %}<option value="{{ type }}" {% if job_type == type %}selected{% endif %}>{{ type|title }}</option>{% endfor %}</select></div>
        <div class="col-md-2"><input class="form-control" type="text" name="company" value="{{ company }}" placeholder="Company"></div>
        <div class="col-md-1"><button class="btn btn-primary w-100" type="submit">Go</button></div>
    </form>
    {% for job in jobs %}
    <div class="card mb-3 shadow-sm">
        <div class="card-body">
            <h4>{{ job.title }}</h4>
            <p>{{ job.company }} • {{ job.location }} • {{ job.job_type }}</p>
            <p>{{ job.description }}</p>
            <a href="{{ url_for('jobs.job_detail', job_id=job.id) }}" class="btn btn-primary">View details</a>
        </div>
    </div>
    {% endfor %}
    {% if not jobs %}<div class="alert alert-info">No matching jobs found.</div>{% endif %}
</div>
{% endblock %}
